[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afora-vehicle-counter"
version = "2.0.0-alpha.1"
description = "Libreria de deteccion, tracking y conteo vehicular multi-backend (YOLO, D-Fine, RT-DETR)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ingeodev"}
]
keywords = ["vehicle-counting", "video-processing", "yolo", "dfine", "object-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "pillow>=10.0.0",
    "rich>=13.0.0",
    "plotly>=6.8.0",
    "kaleido>=1.3.0",
]

[project.optional-dependencies]
# === Backends de IA (sin torch) ===
# torch se instala por separado via variante CUDA (torch-cuXXX / torch-cpu)
yolo = [
    "ultralytics>=8.0.0",
]
dfine = [
    "transformers>=4.30.0",
]
rtdetr = [
    "ultralytics>=8.0.0",
]
tracking = [
    "lapx>=0.5.0",
]

# === Variantes de PyTorch por plataforma CUDA ===
# ATENCION: En Windows, PyPI distribuye solo torch CPU.
# Para CUDA en Windows usar install.ps1 (instala desde pytorch.org)
# o ejecutar manualmente:
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu126
# Estos extras funcionan correctamente en Linux. En Windows solo fijan version.
# Elegir UNA segun el CUDA del sistema:
#   CUDA 12.6 → torch-cu126
#   CUDA 12.4 → torch-cu124
#   CUDA 12.1 → torch-cu121
#   CUDA 11.8 → torch-cu118
#   Auto (recomendado) → usa torch de PyPI con CUDA incluido
torch-cu118 = ["torch==2.4.0", "torchvision==0.19.0"]
torch-cu121 = ["torch==2.4.0", "torchvision==0.19.0"]
torch-cu124 = ["torch==2.5.1", "torchvision==0.20.1"]
torch-cu126 = ["torch==2.6.0", "torchvision==0.21.0"]
torch-auto = ["torch>=2.0.0", "torchvision>=0.15.0"]

# === Meta-combinaciones ===
all = ["afora-vehicle-counter[yolo,dfine,rtdetr,tracking,torch-auto]"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[project.scripts]
afora = "afora_vc.cli.main:main"

[tool.setuptools.packages.find]
include = ["afora_vc*"]

[tool.setuptools.package-data]
"afora_vc" = ["py.typed", "config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: tests that require model downloads or GPU (skipped by default)",
]
addopts = "-m 'not slow'"
