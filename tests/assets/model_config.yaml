# Umbral de confianza global
default_threshold: 0.5

# Umbrales por clase (reemplazan al global para clases especificas)
class_thresholds:
  car: 0.5
  motorcycle: 0.4
  bus: 0.6
  truck: 0.5
  bicycle: 0.4

# Clases de vehiculos a detectar (subconjunto de COCO)
vehicle_classes:
  2: car
  3: motorcycle
  5: bus
  7: truck
  1: bicycle
